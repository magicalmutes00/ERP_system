apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-ingress
  namespace: campus-erp
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - campuserp.com
        - api.campuserp.com
      secretName: campus-tls
  rules:
    - host: campuserp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campus-web
                port:
                  number: 3000
    - host: api.campuserp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campus-backend
                port:
                  number: 4000
