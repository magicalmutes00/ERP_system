apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-web
  namespace: campus-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-web
  template:
    metadata:
      labels:
        app: campus-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/campus-erp-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.campuserp.com/api/v1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: campus-web
  namespace: campus-erp
spec:
  selector:
    app: campus-web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
