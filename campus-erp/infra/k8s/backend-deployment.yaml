apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
  namespace: campus-erp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: campus-backend
  template:
    metadata:
      labels:
        app: campus-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/campus-erp-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              value: campus-redis
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: campus-backend
  namespace: campus-erp
spec:
  selector:
    app: campus-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
